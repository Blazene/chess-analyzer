name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analyzer
          POSTGRES_PASSWORD: analyzer
          POSTGRES_DB: chess_analyzer_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U analyzer -d chess_analyzer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          echo "/usr/games" >> "$GITHUB_PATH"

      - name: Show the Stockfish version
        run: echo quit | /usr/games/stockfish | head -n 1

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests (a skipped test fails the build)
        shell: bash
        run: |
          uv run pytest -q -rs | tee pytest.log
          if grep -Eq "[0-9]+ skipped" pytest.log; then
            echo "Some tests were skipped. Is Stockfish installed?"
            exit 1
          fi

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build the dashboard image
        run: docker build -t chess-analyzer .

      - name: The image has no Stockfish and does not run as root
        run: |
          docker run --rm --entrypoint sh chess-analyzer -c '! which stockfish'
          docker run --rm --entrypoint id chess-analyzer -u | grep -qx 1000

      - name: The dashboard server starts and reports healthy
        run: |
          docker run -d --name dash -p 8501:8501 chess-analyzer
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs dash
          exit 1
